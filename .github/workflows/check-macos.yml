name: Check macOS arm64
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: SDK cache key
        id: sdk
        run: echo "key=$(node scripts/release/cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/release-inputs/eigen.tar.gz
            .cache/release-inputs/boost.tar.bz2
            .cache/kernel/occt.tar.gz
            .cache/mesh-inputs/manifold.tar.gz
            .cache/mesh-inputs/tbb.tar.gz
            .cache/solver/source
          key: native-sources-${{ hashFiles('scripts/native-inputs.mjs', 'scripts/setup-native.mjs', 'scripts/setup-kernel.mjs', 'native/solver/sources.json', 'scripts/occt-recipe.json', 'scripts/mesh-inputs.mjs') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/kernel/sdk
          key: occt-macos-arm64-${{ steps.sdk.outputs.key }}
      - name: Fetch mirrored Eigen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/release-inputs
          if [ ! -f .cache/release-inputs/eigen.tar.gz ]; then
            gh release download native-sources-eigen-5.0.1 --pattern eigen.tar.gz --dir .cache/release-inputs
          fi
      - name: Build and check
        run: |
          npm ci
          npm run setup:native
          npm run setup:kernel
          npm run setup:mesh
          npm run build
          npm run typecheck
          npm run check
          npm test
          npm run test:setup
      - name: Ordinary controls and hidden desktop host
        run: |
          npx playwright install chromium webkit
          node tests/projection-history-ui.mjs
          npm run test:current-tools
          node tests/ui-runtime-cleanup.mjs
          npm run test:electron
