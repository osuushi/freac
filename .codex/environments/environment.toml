    if [ ! -e ".cache/$freac_cache" ] && [ ! -L ".cache/$freac_cache" ] && [ -d "$freac_main_workspace/.cache/$freac_cache" ]; then
      ln -s "$freac_main_workspace/.cache/$freac_cache" ".cache/$freac_cache"
    fi
  done
fi
npm run setup:native
npm run setup:kernel'''

