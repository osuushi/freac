# Match the native macOS SDK settings used by the main workspace/release build.
export CMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES:-$(node -p 'process.arch === "arm64" ? "arm64" : "x86_64"')}"
